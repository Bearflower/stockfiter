name: CI/CD — 构建镜像并自动部署

on:
  push:
    branches: [main]
    paths-ignore:
      - '.trae/**'
      - '.agents/**'
      - 'docs/**'
      - 'data/backtest/**'
      - '*.md'
      - '*.sqlite3'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bearflower

jobs:
  build-and-push:
    name: 🛠️ 构建所有镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kline
            dockerfile: Dockerfile.kline
            image_tag: ghcr.io/bearflower/stockfilter-kline:latest
            dir: ""
          - service: obpc
            dockerfile: Dockerfile.obpc
            image_tag: ghcr.io/bearflower/stockfilter-obpc:latest
            dir: ""
          - service: eadvisor
            dockerfile: Dockerfile.eadvisor
            image_tag: ghcr.io/bearflower/stockfilter-eadvisor:latest
            dir: ""

    steps:
      - uses: actions/checkout@v4

      - name: 🔍 判断是否需要构建
        id: check
        run: |
          CHANGED_FILES=$(git diff HEAD~1 HEAD --name-only 2>/dev/null || echo "")
          echo "本次修改:"
          echo "$CHANGED_FILES"

          # stockfilter_v3 是单目录项目，任何源代码变更都影响所有容器
          # 只有 config.yaml、.env、文档、backtest 数据等不触发构建
          if echo "$CHANGED_FILES" | grep -qE '^(\.trae/|\.agents/|docs/|data/backtest/|logs/|\.env|\.gitignore|ARCHIVE|AGENTS\.md|README\.md)'; then
            # 但如果除了上面还有别的变更，还是要构建
            OTHER_CHANGES=$(echo "$CHANGED_FILES" | grep -vE '^(\.trae/|\.agents/|docs/|data/backtest/|logs/|\.env|\.gitignore|ARCHIVE|AGENTS\.md|README\.md)$' || true)
            if [ -z "$OTHER_CHANGES" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "⏭️  仅文档/配置/规则变更，跳过构建"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 🐳 Setup buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Login GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build + Push ${{ matrix.service }}
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 自动部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: 🔑 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts

          # SSH 客户端配置：统一设置 Host/User/IdentityFile + 超时加固参数
          cat >> ~/.ssh/config << 'SSH_CONFIG'
          Host 43.156.242.184
            User root
            IdentityFile ~/.ssh/id_rsa
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          SSH_CONFIG
          chmod 600 ~/.ssh/config

          # 仅测试 ssh 连通性，不依赖 scp
          ssh 43.156.242.184 "echo '✅ SSH 连通 OK' && hostname && whoami"

      - name: 🚀 远程部署
        run: |
          # 远程执行完整部署流程（compose 文件用 curl 从 GitHub 直接拉，不走 scp）
          DEPLOY_CMD=$(cat <<REMOTE
          set -e
          cd /root/stockfilter_v3

          echo "========================================"
          echo "stockfilter_v3 CI/CD 自动部署"
          echo "commit: ${{ github.sha }}"
          echo "时间: \$(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================"

          # 1. 用 curl 从 GitHub raw 下载最新 compose 文件（绕过 scp）
          echo "📥 下载 docker-compose.yml..."
          curl -fsSL "https://raw.githubusercontent.com/Bearflower/stockfiter/${{ github.sha }}/docker-compose.yml" -o docker-compose.yml

          # 1b. 同步 config/config.yaml（CI 不打包 config，靠 volume 挂载注入）：
          #     与服务器现有文件比对，有变化才替换，并置 NEED_RESTART=1 供步骤 4b 重启加载
          echo "📥 下载 config/config.yaml..."
          NEED_RESTART=0
          curl -fsSL "https://raw.githubusercontent.com/Bearflower/stockfiter/${{ github.sha }}/config/config.yaml" -o /tmp/config.yaml.new
          if ! cmp -s /tmp/config.yaml.new config/config.yaml; then
            echo "♻️  config.yaml 有变化，已更新（将重启容器以生效）"
            mv /tmp/config.yaml.new config/config.yaml
            NEED_RESTART=1
          else
            echo "✅ config.yaml 无变化"
            rm -f /tmp/config.yaml.new
          fi

          # 2. GHCR 认证
          echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u bearflower --password-stdin

          # 3. 拉新镜像
          echo "📥 docker compose pull..."
          docker compose pull

          # 4. 先停止旧容器以冻结 Docker 日志，再紧邻重建动作归档。
          #    归档失败时恢复旧容器并终止部署，不会删除唯一的旧日志副本。
          curl -fsSL "https://raw.githubusercontent.com/Bearflower/stockfiter/${{ github.sha }}/scripts/archive_container_logs.sh" -o /tmp/stockfilter-archive-container-logs.sh
          if ! docker compose stop; then
            docker compose start
            echo "❌ 旧容器停止失败，已尝试恢复，停止部署" >&2
            exit 1
          fi
          if ! bash /tmp/stockfilter-archive-container-logs.sh /root/stockfilter_v3/logs/container_archive; then
            docker compose start
            echo "❌ 旧容器日志归档失败，已恢复原容器，停止部署" >&2
            exit 1
          fi

          # 5. 更新所有容器
          echo "🔄 docker compose up -d..."
          docker compose up -d --remove-orphans

          # 4b. config.yaml 有变化时重启容器：config 走 volume 挂载，
          #     若镜像未变则 up -d 不会重建容器、进程不会重读配置，必须 restart 才生效
          if [ "\$NEED_RESTART" = "1" ]; then
            echo "🔄 重启容器以加载新 config.yaml..."
            docker compose restart
          fi

          # 5. 等就绪
          echo "⏳ 等待 15s..."
          sleep 15

          # 6. 状态检查
          echo ""
          echo "✅ 当前容器状态："
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep stockfilter || echo "⚠️ 未找到 stockfilter 容器"

          # 7. 写部署日志
          mkdir -p deploy_logs
          DEPLOY_TIME="\$(date '+%Y-%m-%d %H:%M:%S')"
          echo "[\${DEPLOY_TIME}] DEPLOY_SUCCESS commit=${{ github.sha }}" >> "deploy_logs/\$(date '+%Y%m%d').log"

          # 8. 清理悬空镜像（pull 新 latest 后旧镜像残留，防磁盘堆积打满）
          #    只删未被任何容器使用的悬空镜像，保留被 stopped 容器占用的旧版本镜像，
          #    失败不阻断部署结果
          echo "🧹 清理悬空镜像..."
          docker image prune -f || true

          echo ""
          echo "🎉 stockfilter_v3 CI/CD 部署完成！"
          REMOTE
          )

          # 远程执行（base64 编码避免转义问题）
          echo "$DEPLOY_CMD" | base64 -w0 | ssh 43.156.242.184 "base64 -d | bash -s"
