name: CI/CD — 构建镜像并自动部署

on:
  push:
    branches: [main]
    paths-ignore:
      - '.trae/**'
      - '.agents/**'
      - 'docs/**'
      - 'data/backtest/**'
      - '*.md'
      - '**/*.md'
      - '*.sqlite3'
  workflow_dispatch:

# 中途取消会打断 stop→archive→up，发布必须串行排队。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: 🛠️ 构建所有镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kline
            dockerfile: Dockerfile.kline
            image_tag: ghcr.io/bearflower/stockfilter-kline:latest
          - service: obpc
            dockerfile: Dockerfile.obpc
            image_tag: ghcr.io/bearflower/stockfilter-obpc:latest
          - service: eadvisor
            dockerfile: Dockerfile.eadvisor
            image_tag: ghcr.io/bearflower/stockfilter-eadvisor:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 判断完整 push 是否需要构建
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "push 基准提交不可用，保守构建全部镜像"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BEFORE" "${{ github.sha }}" > "$RUNNER_TEMP/changed_files.txt"
          echo "本次 push 完整变更："
          sed -n '1,100p' "$RUNNER_TEMP/changed_files.txt"
          if grep -Ev '(^\.trae/|^\.agents/|^docs/|^data/backtest/|^logs/|^\.env$|^\.gitignore$|^config/config\.yaml$|\.md$|\.sqlite3$)' "$RUNNER_TEMP/changed_files.txt" | grep -q .; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "仅文档或配置变更，跳过镜像构建"
          fi

      - name: 🐳 Setup buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Login GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build + Push ${{ matrix.service }}
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image_tag }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 自动部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔑 配置 SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'SSH_CONFIG'
          Host 43.156.242.184
            User root
            IdentityFile ~/.ssh/id_rsa
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          SSH_CONFIG
          chmod 600 ~/.ssh/config
          ssh 43.156.242.184 "echo 'SSH 连通 OK' && hostname && whoami"

      - name: 🚀 远程部署（健康门槛 + 监控切换 + 日志归档）
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          remote_script="/tmp/stockfilter-deploy-${{ github.run_id }}.sh"
          raw="https://raw.githubusercontent.com/Bearflower/stockfiter/${{ github.sha }}/scripts/deploy_release.sh"
          ssh 43.156.242.184 "curl -fsSL --retry 3 '$raw' -o '$remote_script' && bash -n '$remote_script'"
          printf '%s\n' "$GHCR_PULL_TOKEN" | \
            ssh 43.156.242.184 "bash '$remote_script' '${{ github.sha }}' '${{ github.run_id }}'"
