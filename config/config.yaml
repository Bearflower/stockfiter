        - code: "510500"
          name: "中证500ETF"
          index: "000905"
          category: "A股-宽基"
          buy_zone: { pe_percentile_max: 30 }
          sell_zone: { pe_percentile_min: 70 }
          shares_per_trade: 1
          max_shares: 10
        - code: "510050"
          name: "上证50ETF"
          index: "000016"
          category: "A股-宽基"
          buy_zone: { pe_percentile_max: 30 }
          sell_zone: { pe_percentile_min: 70 }
          shares_per_trade: 1
          max_shares: 8
        - code: "159915"
          name: "创业板ETF"
          index: "399006"
          category: "A股-宽基"
          buy_zone: { pe_percentile_max: 20 }
          sell_zone: { pe_percentile_min: 80 }
          shares_per_trade: 1
