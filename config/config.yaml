# ==================== 回测配置（R08/R19/R20 硬编码整改） ====================
# 所有回测脚本的模块级硬编码常量从此读取，禁止在 backtest_*.py 里写死
section_backtest:
  # === cross_section 截面回测（scripts/backtest_cross_section.py） ===
  cross_section:
    rebalance_days: 20       # 调仓周期（交易日）
    top_k: 20                # 截面持仓数量（Top K 因子选股）
    lookbacks: [20, 60]      # 因子回看期（动量/反转各跑两档）
    cost: 0.0035             # 单次完整交易成本（约 0.35%，复用 OBPC 口径）
    ma_period: 20            # 温度计趋势均线周期
    slope_lookback: 5        # 温度计斜率回看天数
    macd: [12, 26, 9]        # 温度计 MACD (fast, slow, signal)
    vol_period: 20           # 温度计波动率计算周期
    # 未来波动率修复（R08）：expanding median 消除前视偏差
    use_training_window: false  # false=扩展窗滚动统计；true=固定训练期
    training_window_days: 500   # use_training_window=true 时的训练期天数

  # === swing 波段回测（scripts/backtest_swing.py） ===
  swing:
    # 交易成本（复用 OBPC 口径，与 strategies.oversold_bounce.params 保持一致）
    commission: 0.00025      # 佣金（双边）
    stamp_tax: 0.001         # 印花税（仅卖出）
    slippage: 0.001          # 滑点（双边）
    # 固定止盈止损（与 OBPC hard_stop_loss=0.10 不同，swing 独立配置）
    take_profit: 0.15        # 固定止盈比例
    stop_loss: 0.08          # 固定止损比例
    # 技术指标参数（算法核心常量，保留但从 config 读）
    strategy_params:
      ma_cross: {fast: 5, slow: 20}
      macd: {fast: 12, slow: 26, signal: 9}
      rsi: {period: 14, oversold: 30, overbought: 70}
      boll: {period: 20, num_std: 2.0}
    # EXIT_MODES 是纯枚举标签，保持 ['indicator', 'stop'] 即可，无需入 config

  # === obpc OBPC 回测（scripts/backtest_obpc.py） ===
  # OBPC 回测已从 strategies.oversold_bounce.params 读取交易成本/止损/风控参数，
  # 此处不重复，避免双源漂移

# ==================== 定时任务调度 ====================
schedule:
  kline_update: "15:00"     # K线数据更新（UTC 15:00 = 北京 23:00，2026-10-20 错峰避开 Baostock 晚间高峰）
  daily_scan: "15:15"       # 每日形态扫描（UTC 15:15 = 北京 23:15）
  feishu_push: "00:10"      # 飞书推送（UTC 00:10 = 北京 08:10）
  backfill: "02:00"         # 历史数据补全（UTC 02:00 = 北京 10:00）

# ==================== E大蒸馏策略调度 ====================
distill_changying:
  advisor:
    schedule:
      scan_time: "23:10"         # 每日扫描时间（北京时间）
      feishu_timeout: 10         # 飞书推送超时（秒）
      post_scan_sleep: 90        # 扫描后等待时间（秒）
      poll_interval: 30          # 轮询间隔（秒）
      scan_timeout: 1200         # 整体扫描超时（秒），防止卡死阻塞定时任务（baostock 数据获取较慢，需1200秒）
