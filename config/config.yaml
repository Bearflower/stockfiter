# stockfilter_v3 统一配置文件
# 版本: V3.0
# 最后更新: 2026-05-15

# ==================== 全局配置 ====================
global:
  # 数据库配置
  database:
    host: localhost
    port: 5432
    database: stockfilter
    user: postgres
    password: your_password

  # 股票列表文件路径（优先从该文件读取股票列表，文件不存在时回退到数据库）
  stock_list_file: "/app/main_board_stocks.csv"

  # 股票池全局过滤配置
  stock_pool:
    exclude_st: true
    exclude_delisting: true
    exclude_beijing: true
    exclude_star_market: true      # 剔除科创板（688/689 开头）
    exclude_chi_next: true          # 剔除创业板（300/301 开头）
    exclude_new_third_board: true   # 剔除新三板
    exclude_index: true             # 剔除指数
    exclude_new_stocks: true        # 剔除次新股
    new_stock_cutoff_date: "2025-01-01"
    main_board_only: true           # 只保留主板（深000/001/002 沪600/601/603/605）
    # ---- 以下前缀/关键词列表可覆盖 data.database.filter_stock_pool 的默认值 ----
    # 北交所代码前缀列表（含 920 开关的新代码段；430xxx 由新三板规则覆盖）
    beijing_prefixes: ["83", "87", "920"]
    # 新三板代码前缀列表（仅 43xxx，8xx 已被北交所覆盖）
    new_third_board_prefixes: ["43"]
    # 主板仅保留的代码前缀（深 000/001/002，沪 600/601/603/605）
    main_board_prefixes: ["000", "001", "002", "600", "601", "603", "605"]
    # 指数/ETF/基金名称关键词（用于 name 列模糊匹配取并集，避免"原来被排除、现在被保留"的回归）
    exclude_index_keywords:
      - "指数"
      - "ETF"
      - "基金"
      - "B股"
      - "上证"
      - "深证"
      - "中证"
      - "全指"
      - "等权"
      - "基本"
      - "新兴"
      - "国企"
      - "海外"

  # 通知配置
  notification:
    enabled: true
    remote_url: "http://43.156.242.184:8766/api/v1"
    feishu_webhook: ${FEISHU_WEBHOOK:-}

  # K线服务配置
  kline_service:
    remote_url: "http://43.156.242.184:8765/api/v1"

  # K线数据补全配置（quick_backfill.py 故障熔断保护参数）
  backfill:
    days_back: 10                  # 回溯检查的自然日天数
    kline_days: 20                 # 每只股票获取的 K 线天数
    batch_size: 1000               # 每批查询缺失股票的数量
    max_stocks_per_run: 4000       # 单次运行最多处理股票数（防止失控）
    failure_rate_threshold: 0.7    # 滑动窗口失败率熔断阈值（70%）
    failure_window_size: 100       # 滑动窗口大小（最近 N 次请求）
    failure_window_min_samples: 50 # 熔断判定所需最小样本数
    total_failure_limit: 300       # 累计失败硬上限

  # K线日更新完整性判定配置（update_kline_daily.py）
  # 与 backfill 节语义不同：日更新关注「全市场当日数据是否完整」
  kline_update:
    days_to_update: 5              # C-1：更新最近多少天的数据（防止遗漏）
    request_interval_seconds: 0.05 # M-2：每次请求后休眠时间（秒），限流防止触发 Baostock API
    target_date_max_backtrack: 7   # P1：计算目标交易日时最多回溯的自然日数（覆盖周末+常见节假日；春节例外时兜底到库内最新交易日）
    failure_rate_threshold: 0.7    # 滑动窗口失败率熔断阈值
    failure_window_size: 100       # 滑动窗口大小（最近 N 次请求）
    failure_window_min_samples: 50 # 熔断判定最小样本数
    total_failure_limit: 250       # 单个分片累计失败硬上限；必须小于 worker_chunk_size，否则分片内永达不到（load_collection_config 强校验）
    min_success_rate: 0.9         # 完整性：成功率红线（成功/(成功+失败)）
    min_coverage_rate: 0.98        # 完整性：处理覆盖率红线（熔断后未遍历股票计入分母，禁止大面积漏处理）
    skipped_ratio_guard: 0.95      # 休市日 guard 阈值：仅当 target_date 为非交易日时，skipped_ratio ≥ 此值才放行（is_complete 第 3 条）

    # ---- 进程级隔离 + 数据库断点续采（2026-10-22 改造） ----
    # 单个 Baostock 请求不可安全取消，因此不再做单股线程超时；
    # 超时由监督者终止整个工作进程，再用新进程从数据库缺口继续。
    #
    # 初值推导依据（本地 100 只基准 BLOCKED：2026-10-22 两次尝试均在 Baostock
    # 登录阶段被连接重置 Errno 54 / 网络接收错误，未取得 p95；初值改由生产证据推导，
    # 待故障注入阶段复测校准）：
    #   - 生产证据：2909 只夜间任务在旧 3h 外层超时内正常完成，唯一异常出现在
    #     第 610 只股票单股挂死（旧单股超时 15s）。
    #   - worker_chunk_size=300：常态单股 < 0.5s 推算，单分片常态 < 150s，
    #     既能在超时后快速重查缺口，也能覆盖股票池约 10% 的进展。
    #   - worker_timeout_seconds=300：约为常态分片耗时的 2 倍；单只挂死最多
    #     浪费 300s，但进度文件已定位到具体股票，其余已落库股票不会重复采集。
    #   - worker_terminate_grace_seconds=10：足够 Python 响应 SIGTERM 关闭 Baostock
    #     socket；超时未退则 SIGKILL，由操作系统回收残留线程/连接。
    #   - max_session_restarts=6：每次进程超时只损失 1 只挂起股票，6 次约覆盖
    #     股票池 0.2% 的离散挂死；超过则视为会话级故障，停止恢复并判失败。
    #   - recovery_deadline_buffer_seconds=300：为 OBPC 初扫等待窗口预留 5 分钟
    #     写库与扫描启动时间；截止时间 = 初扫时刻 + KLINE_WAIT_TIMEOUT - 本余量。
    #   - immediate_recovery_enabled=true：主采集失败后立即断点恢复，不等次日 07:00。
    #   - max_consecutive_no_progress_rounds=2：连续 2 个分片既无新增落库、也没有
    #     新识别并隔离挂死股票，说明 Baostock/数据库整体不可用；新隔离动作属于
    #     有效状态推进，不计入无进展，最终仍由会话重建上限和截止时间兜底。
    #   - max_quarantined_retries=1：超时股票先延后隔离，普通缺口处理完后最多
    #     再重试 1 次；永久挂死股票最终计入 failed，不会反复占据队首阻塞其余缺口。
    #   - db_query_timeout_seconds=30 / db_connect_timeout_seconds=10：监督者自身
    #     数据库操作的时间上限，避免慢查询或建连阻塞突破整体截止时间。
    worker_chunk_size: 300
    worker_timeout_seconds: 300
    worker_terminate_grace_seconds: 10
    max_session_restarts: 6
    recovery_deadline_buffer_seconds: 300
    immediate_recovery_enabled: true
    max_consecutive_no_progress_rounds: 2
    max_quarantined_retries: 1
    db_query_timeout_seconds: 30
    db_connect_timeout_seconds: 10
    # task_status 运行期只做轻量 UPSERT；最坏预算
    # 3×(10s 建连 + 30s SQL + 2×1s 进程回收) + 2×1s 间隔
    # = 128s < 300s 恢复余量；父进程 watchdog 会强制终止卡死写入进程。
    task_status_write_retries: 3
    task_status_write_retry_delay_seconds: 1
    task_status_process_terminate_grace_seconds: 1

  # 日志配置
  logging:
    level: INFO
    file: logs/stockfilter_v3.log
    max_bytes: 10485760
    backup_count: 5

# ==================== 策略配置 ====================
strategies:
  oversold_bounce:
    enabled: true
    version: "v25"
    description: "超跌反弹回踩确认策略 V2.0"
    params:
      # K线数据获取参数
      kline_history_days: 120          # 获取历史K线的天数
      min_kline_length: 60             # 最小有效K线数量（不足则跳过）

      # 窗口回退（N-2）：retrace_date 距 signal_date 的最大允许偏移日数
      # 默认 1 = 覆盖信号日及前一日两个交易日（周末/节假日自然跳过）
      signal_window_fallback_days: 1

      # 大跌检测
      drop_threshold: 0.15
      drop_window: 20

      # 缩量检测（放量日前10天内）
      volume_shrink_ratio: 0.5
      shrink_to_surge_days: 10

      # 放量检测
      min_volume_ratio: 2.0
      max_volume_ratio: 12.0
      surge_price_ratio: 0.06
      surge_lookback: 15

      # 方案A参数（flat_days=1 启用方案A：缩量走平1天）
      flat_days: 1
      flat_volume_threshold: 0.85
      flat_price_range: 0.08
      post_surge_check_days: 5
      post_surge_max_drop: 0.97

      # 回踩确认
      retrace_max_days: 10
      support_ratio: 0.985

      # 流动性
      min_avg_amount: 30000000
      volume_check_period: 20

      # 交易参数（供回测使用）
      trailing_stop_ratio: 0.08
      hard_stop_loss: 0.10
      stop_loss_ratio: 0.97
      min_hold_days: 5
      max_hold_days: 30
      commission: 0.00025
      stamp_tax: 0.001
      slippage: 0.001

      # 大盘环境过滤（增强）
      index_filter:
        enabled: true                    # 大盘过滤总开关
        index_code: "000300.SH"          # 指数代码
        index_ma_period: 20              # 短周期均线天数
        index_ma_period_long: 60         # 长周期均线天数（新增：60日均线）
        long_ma_filter_enabled: true     # 60日均线过滤开关（新增）

        # ===== V2.1 新增：MACD 动量过滤 =====
        method: 'ma_position'            # 过滤方法：'ma_position'（V2.0 均线位置）或 'macd'（V2.1 动量）
        macd_fast: 12                    # MACD 快线周期（method='macd' 时生效）
        macd_slow: 26                    # MACD 慢线周期（method='macd' 时生效）
        macd_signal: 9                   # MACD 信号线周期（method='macd' 时生效）
        condition: 'dif > 0'             # MACD 过滤条件（method='macd' 时生效）

        # ===== V2.1 新增：均线斜率过滤 =====
        slope_filter_enabled: true       # 斜率过滤开关（V2.1 已启用：均线向下拐头时禁止开仓）
        slope_ma_period: 60              # 斜率计算的均线周期（20 或 60）
        slope_lookback: 5                # 斜率回看天数（当前均线 vs N 天前均线）
        slope_threshold: 0.002           # 斜率阈值（0.2%），大于该值才视为均线向上
        min_index_data_days: 30          # 最小指数数据获取天数（确保数据量足够计算指标）

        # ===== P1 新增：指数数据新鲜度校验（R06） =====
        freshness_strategy: "skip"       # fail | stale_days | skip：指数数据不新鲜时的降级策略
        freshness_stale_days: 3          # strategy=stale_days 时允许的最近 N 交易日

      # ===== V3 新增：分级市场风控（默认 hard_filter，与现网行为完全一致） =====
      # 生产启用 graded 必须经过本地回测和影子运行，并单独授权
      #
      # mode 取值：
      #   - hard_filter：现有行为（MA20/MA60/斜率三重硬过滤 + 评分调整）
      #   - graded：分级裁决（强市正常 / 弱市高分+RS+低仓位 / 极弱硬阻断）
      #   - shadow：影子模式——主流程仍走 hard_filter（正式信号不变），
      #       额外独立计算 graded 裁决并写入 scan_runs.data_metrics 供审计，
      #       不改变 signals_*.json 和飞书推送的任何内容
      market_regime_policy:
        mode: hard_filter
        base_position_pct: 0.10
        weak:
          allow_entry: false
          position_multiplier: 0.0
          score_threshold: 0.0
          daily_signal_limit: 0
          require_relative_strength: true
          relative_strength_lookback: 20
          relative_strength_min: 0.0
        extreme_weak:
          allow_entry: false
          position_multiplier: 0.0
          daily_signal_limit: 0

      # 信号间隔控制
      signal_cooldown_days: 60           # 信号冷却期（交易日）
      max_signals_per_year: 2            # 单股票年度限制
      max_signals_per_month: 30          # 单月信号数上限

      # 评分阈值过滤（新增整段）
      score_filter:
        enabled: true                        # 评分过滤总开关
        score_threshold: 65                  # 默认评分阈值（低于此分不推送）
        score_threshold_weak: 75             # 弱势市场评分阈值
        weak_market_condition: "below_ma60"  # 弱势市场判定条件

      # ===== V2.1 新增：评分市场状态调整 =====
      # 在个股形态评分基础上加入大盘相对强度调整系数
      # 强势市场评分放大、弱势市场评分缩小、极弱市场评分归零
      score_adjustment:
        enabled: true                          # 评分调整开关（V2.1 已启用：根据市场状态调整评分）
        score_multiplier_strong: 1.2           # 强势市场评分放大系数
        score_multiplier_weak: 0.8             # 弱势市场评分缩小系数
        score_multiplier_extreme_weak: 0.0     # 极弱市场评分系数（0.0=评分归零）
        score_max_limit: 100.0                 # 评分上限（调整后评分不超过此值）
        score_min_limit: 0.0                   # 评分下限（调整后评分不低于此值）

      # 每日信号数上限（Top N 稀缺性控制）
      # 每日最多推送 N 个评分最高的信号，其余丢弃
      max_daily_signals: 5

    # V2.0 预期指标（用于回测结果对比，便于评估策略表现偏离度）
    expected_metrics:
      total_trades: 28                  # 预期总信号数
      signals_per_year: 5.6             # 预期年均信号数
      avg_return: 3.28                  # 预期平均收益（%）
      win_rate: 67.9                    # 预期胜率（%）
      max_return: 20.24                 # 预期最高收益（%）
      min_return: -6.40                 # 预期最低收益（%）

    # 通知模板
    notification:
      template: "oversold_bounce_card"

  distill_changying:
    enabled: true
    version: "v1"
    description: "基于E大估值框架的A股温度评估策略"
    notify: true

    # 估值温度阈值 —— PE 历史分位 %
    params:
      diamond_pit: 10
      undervalued: 30
      normal: 70
      overvalued: 90
      confidence_high: 0.8
      confidence_medium: 0.5

      # 仓位映射
      position_mapping:
        diamond_pit:
          stock: 80
          bond: 10
          cash: 10
        undervalued:
          stock: 60
          bond: 25
          cash: 15
        normal:
          stock: 40
          bond: 40
          cash: 20
        overvalued:
          stock: 20
          bond: 50
          cash: 30
        bubble:
          stock: 5
          bond: 35
          cash: 60

      # 指数列表
      indices:
        - { code: "000001", name: "上证指数" }
        - { code: "399001", name: "深证成指" }
        - { code: "000300", name: "沪深300" }
        - { code: "000905", name: "中证500" }
        - { code: "399006", name: "创业板指" }
        - { code: "000016", name: "上证50" }

      # 缓存 TTL（小时）
      cache_ttl_hours: 6

      # LLM 参数
      llm_temperature: 0.7
      llm_max_tokens: 2000
      llm_max_retries: 3
      llm_retry_base_delay: 5

      # 知识底座压缩参数
      max_chars_per_section: 300
      max_total_tokens: 3000

      # baostock 数据源配置
      data_source:
        start_date: "2010-01-01"
        constituent_sample_size: 50
        percentile_lookback_years: 5
        pe_filter_min: 0
        pe_filter_max: 1000
        pb_filter_min: 0
        # P1 新增（R01）：使用真实估值分位
        # true=pe_percentile/pb_percentile 只接受真实估值序列分位，价格分位独立成 price_percentile
        # false=保留旧近似但独立标注 price_percentile
        use_real_valuation_percentile: true

      # 150 份资产配置
      allocation:
        total_shares: 150
        nav_per_share: 10000

      # ETF 品种池 —— 用于生成具体买卖建议
