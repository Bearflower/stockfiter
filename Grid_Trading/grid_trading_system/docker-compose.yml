# 网格交易系统 - Docker Compose 配置
version: "3.8"

services:
  # 网格交易主服务
  grid-trading:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grid-trading-system
    restart: unless-stopped
    environment:
      # 运行模式: auto 或 signal
      - SYSTEM_MODE=${SYSTEM_MODE:-auto}
      # 币安 API 配置
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # 飞书通知
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK:-}
    volumes:
      # 持久化数据
      - ./data:/app/data
      - ./logs:/app/logs
      # 配置文件
      - ./config/config.yaml:/app/config/config.yaml:ro
    networks:
      - trading-network
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # 可选: MySQL 数据库服务
  # mysql:
