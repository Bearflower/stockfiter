version: '3.8'

# ============================================================
# stockfilter_v3 - 3容器分离架构（CI/CD 自动部署版）
# ============================================================
# 镜像来自 GHCR：ghcr.io/bearflower/stockfilter-xxx:latest
# 配置文件 config.yaml 通过 volume 挂载，不进镜像
# 改配置 → 重启容器生效，无需重新构建
# ============================================================

services:
  # ==================== 容器 1: K线数据服务 ====================
  kline-service:
    image: ghcr.io/bearflower/stockfilter-kline:latest
    container_name: stockfilter-kline
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=${DB_HOST:-common_service_postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-stockfilter}
      - DB_USER=${DB_USER:-stockfilter_user}
      - DB_PASSWORD=${DB_PASSWORD:-Stock@2024}
      - DB_SCHEMA=${DB_SCHEMA:-schema_stockfilter}
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data:ro
      - ./config/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped
    networks:
      - common_service_common_network
    command: python -u scripts/scheduler_kline.py

  # ==================== 容器 2: OBPC 策略服务 ====================
  strategy-obpc:
    image: ghcr.io/bearflower/stockfilter-obpc:latest
    container_name: stockfilter-obpc
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
      - DB_HOST=${DB_HOST:-common_service_postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-stockfilter}
      - DB_USER=${DB_USER:-stockfilter_user}
      - DB_PASSWORD=${DB_PASSWORD:-Stock@2024}
      - DB_SCHEMA=${DB_SCHEMA:-schema_stockfilter}
      - PYTHONPATH=/app
      - KLINE_WAIT_TIMEOUT=1800
      - KLINE_WAIT_INTERVAL=60
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
      - ./data:/app/data:ro
      - ./config/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped
    networks:
      - common_service_common_network
    depends_on:
      - kline-service
    command: python -u scripts/scheduler_obpc.py

  # ==================== 容器 3: E大估值策略服务 ====================
  strategy-eadvisor:
    image: ghcr.io/bearflower/stockfilter-eadvisor:latest
    container_name: stockfilter-eadvisor
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_WEBHOOK_EADVISOR=${FEISHU_WEBHOOK_EADVISOR}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - PYTHONPATH=/app:/app/distill_changying
    volumes:
      - ./logs:/app/logs
      - ./distill_changying/docs/distilled/logs:/app/distill_changying/docs/distilled/logs
      - ./config/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped
    networks:
      - common_service_common_network
    command: python -u distill_changying/scripts/advisor/scheduler.py

networks:
  common_service_common_network:
    external: true
